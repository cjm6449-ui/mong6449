<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>몽도시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed diorama canvas; frosted HUD floats at the four edges, never over the street */
:root{
  --ink:#1c2230; --ink-2:#5d6476; --ink-3:#8b92a3;
  --glass:rgba(248,250,252,.72); --glass-hi:rgba(255,255,255,.94); --hair:rgba(28,34,48,.09);
  --accent:#17867f; --accent-soft:rgba(23,134,127,.12);
  --stage:#dde6ee;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:18px; --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px rgba(20,30,50,.35),0 2px 6px -2px rgba(20,30,50,.15);
  --gl:max(14px,env(safe-area-inset-left,0px)); --gr:max(14px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 14px); --gb:calc(env(safe-area-inset-bottom,0px) + 14px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--stage);color:var(--ink);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow)}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:transform .15s,background .15s}
.ico:hover{background:var(--glass-hi)}.ico:active{transform:scale(.94)}
.ico svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.on{background:var(--ink)}.ico.on svg{stroke:#fff}
.eyebrow{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}

#hudTop{position:fixed;top:var(--gt);left:var(--gl);right:var(--gr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
#hudTop>*{pointer-events:auto}
#place{padding:12px 18px 12px 16px;border-radius:var(--r);min-width:0}
#place h1{font:700 24px/1.15 var(--display);letter-spacing:-.01em;margin:6px 0 2px;text-wrap:balance}
#place .en{font-size:12px;color:var(--ink-2)}
#cluster{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#walletPill{height:40px;padding:0 16px 0 10px;border-radius:999px;display:flex;align-items:center;gap:8px;font:600 14px var(--ui);font-variant-numeric:tabular-nums}
#walletPill i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a8,#e0a93c 60%,#a8701a);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.iconRow{display:flex;gap:2px;padding:0 3px;border-radius:999px;height:46px;align-items:center}

#minimap{position:fixed;right:var(--gr);top:calc(var(--gt) + 58px);padding:12px;border-radius:var(--r);z-index:4;width:196px}
#map{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px}
#map div{font-size:10px;line-height:1.2;text-align:center;padding:7px 2px;border-radius:8px;background:rgba(255,255,255,.55);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#map div.cur{background:var(--ink);color:#fff;font-weight:600}

#logWrap{position:fixed;left:var(--gl);bottom:calc(var(--gb) + 70px);width:min(300px,calc(100% - 28px));z-index:4;pointer-events:none;transition:opacity .6s}
#logWrap.idle{opacity:.35}#logWrap:hover{opacity:1}
#log{max-height:min(24vh,150px);overflow-y:auto;padding:10px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.6;pointer-events:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
#log::-webkit-scrollbar{display:none}
#log .s{color:var(--ink-2)}#log .e{color:var(--ink-3);font-style:italic}
#log b{font-weight:600}#log .me{color:var(--accent)}#log .npc{color:#9a5b1d}#log .pc{color:#3e5fbf}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--gb);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;z-index:5;width:min(760px,calc(100% - 28px))}
#emotes{display:flex;gap:2px;flex:none}
#emotes button{width:38px;height:38px;border-radius:50%;font-size:18px;display:grid;place-items:center;transition:transform .15s,background .15s}
#emotes button:hover{background:var(--glass-hi);transform:translateY(-2px)}
#bar{flex:1;display:flex;gap:6px;min-width:0}
#chatIn{flex:1;min-width:0;height:40px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.85);padding:0 16px;font:400 14px var(--ui);color:var(--ink);outline:none}
#chatIn::placeholder{color:var(--ink-3)}
.primary{height:40px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;transition:transform .15s}
.primary:active{transform:scale(.96)}

#sheet{position:fixed;top:var(--gt);right:var(--gr);bottom:var(--gb);width:min(320px,calc(100% - 28px));border-radius:22px;z-index:8;padding:20px;display:flex;flex-direction:column;gap:18px;overflow:auto;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);background:var(--glass-hi)}
#sheet.open{transform:none}
#sheet header{display:flex;justify-content:space-between;align-items:center}
#sheet h2{font:700 20px var(--display)}
.money{display:grid;gap:8px}
.money div{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:14px;background:rgba(28,34,48,.04)}
.money span{color:var(--ink-2);font-size:13px}.money b{font:600 17px var(--ui);font-variant-numeric:tabular-nums}
#inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#inv .it{aspect-ratio:1;max-width:100%;border-radius:12px;background:rgba(28,34,48,.05);display:grid;place-items:center;font-size:22px;position:relative;transition:background .15s}
#inv .it:hover{background:rgba(28,34,48,.1)}
#inv .it small{position:absolute;right:4px;bottom:2px;font:600 10px var(--ui);color:var(--ink-2)}
#inv .it.held{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.empty{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);padding:6px 0}
#who div{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--hair)}
#who div:last-child{border:0}
#who i{width:8px;height:8px;border-radius:50%;background:var(--accent)}#who i.n{background:#d9a35a}
.sec h3{margin-bottom:8px}

#modal{position:fixed;inset:0;background:rgba(20,26,40,.28);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .card{width:min(420px,100%);max-height:88vh;overflow:auto;border-radius:24px;background:var(--glass-hi);padding:22px;box-shadow:0 30px 80px -20px rgba(20,30,50,.5)}
#mTitle{font:700 21px var(--display);margin:6px 0 14px}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;background:rgba(28,34,48,.05);transition:background .15s,transform .15s}
.opt:hover{background:rgba(28,34,48,.1)}.opt:active{transform:scale(.98)}
.opt b{font-size:22px;line-height:1;min-width:24px;text-align:center}.opt span{font-size:13px;line-height:1.35}.opt em{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ghost{height:40px;padding:0 18px;border-radius:999px;background:rgba(28,34,48,.06);font-weight:500}
.screen{border-radius:14px;padding:14px 16px;background:#0f2a27;color:#8ff0d6;font:500 13px/1.7 var(--mono)}
.note{color:var(--ink-2);font-size:13px}

#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;background:linear-gradient(180deg,rgba(221,230,238,.35),rgba(221,230,238,.75));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto}
#login .card{width:min(720px,100%);border-radius:28px;background:var(--glass-hi);box-shadow:0 40px 100px -30px rgba(20,30,50,.55);display:grid;grid-template-columns:260px 1fr;overflow:hidden;margin:auto}
#preview{position:relative;background:linear-gradient(180deg,#cfe3f2,#f3e7da);min-height:320px}
#face{width:100%;height:100%;position:absolute;inset:0}
#combo{position:absolute;left:16px;bottom:14px;font:500 10px var(--mono);letter-spacing:.1em;color:rgba(28,34,48,.55)}
#login .form{padding:28px 28px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
#login h2{font:700 34px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
#login p{color:var(--ink-2);font-size:13.5px;max-width:42ch}
#nameIn{height:46px;border-radius:14px;border:1px solid var(--hair);background:#fff;padding:0 16px;font:500 15px var(--ui);color:var(--ink);outline:none;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.row{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:12px;background:rgba(28,34,48,.045);padding:0 4px}
.row span{font-size:13px;color:var(--ink-2)}.row span b{color:var(--ink);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
.row button{width:30px;height:30px;border-radius:9px;color:var(--ink-2);font-size:16px}
.row button:hover{background:#fff;color:var(--ink)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
#enter{height:48px;padding:0 26px;font-size:15px;background:var(--accent)}

@media (max-width:760px){
  #minimap{display:none}
  #login .card{grid-template-columns:1fr}
  #preview{min-height:190px}
  #login h2{font-size:28px}
  #dock{flex-wrap:wrap;border-radius:24px;justify-content:center}
  #emotes{width:100%;justify-content:space-between;overflow-x:auto}
  #logWrap{bottom:auto;top:calc(var(--gt) + 112px);width:calc(100% - 28px)}
  #log{max-height:92px;font-size:12px}
  #place h1{font-size:20px}
  #place{padding:10px 14px}
  #walletPill{padding:0 12px 0 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="몽도시 거리 화면"></canvas>

<div id="hudTop">
  <div id="place" class="glass"><div class="eyebrow" id="coord">B2 · MONG CITY</div><h1 id="regionName">중앙광장</h1><div class="en" id="regionEn">Central Plaza</div></div>
  <div id="cluster">
    <div id="walletPill" class="glass"><i></i><span id="walletTop">₩10,000</span></div>
    <div class="iconRow glass">
      <button class="ico" id="nightBtn" aria-label="낮과 밤 바꾸기" title="낮과 밤 바꾸기"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button class="ico" id="sndBtn" aria-label="효과음 끄기" title="효과음"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
      <button class="ico" id="ttsBtn" aria-label="채팅 음성으로 읽기" title="채팅 음성으로 읽기"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="ico" id="bagBtn" aria-label="가방 열기" title="가방"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
    </div>
  </div>
</div>

<nav id="minimap" class="glass" aria-label="도시 지도"><div class="eyebrow">City map</div><div id="map"></div></nav>

<div id="logWrap"><div id="log" class="glass" aria-live="polite"></div></div>

<div id="dock" class="glass">
  <div id="emotes">
    <button data-e="wave" title="인사" aria-label="인사">👋</button><button data-e="jump" title="점프" aria-label="점프">⤴️</button>
    <button data-e="sit" title="앉기" aria-label="앉기">🪑</button><button data-e="dance" title="춤" aria-label="춤">💃</button>
    <button data-e="laugh" title="웃음" aria-label="웃음">😆</button><button data-e="cry" title="울음" aria-label="울음">😢</button>
    <button data-e="angry" title="화남" aria-label="화남">😤</button><button data-e="love" title="하트" aria-label="하트">💗</button>
  </div>
  <form id="bar"><input id="chatIn" maxlength="60" placeholder="말하기… (Enter)" autocomplete="off" aria-label="채팅 입력"><button class="primary">보내기</button></form>
</div>

<aside id="sheet" class="glass" aria-label="내 가방">
  <header><div><div class="eyebrow">Resident</div><h2 id="myName">-</h2></div><button class="ico" id="sheetClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div class="money"><div><span>지갑</span><b id="wallet">0원</b></div><div><span>몽은행 통장</span><b id="bank">0원</b></div><div id="spouseRow" hidden><span>배우자</span><b id="spouse"></b></div></div>
  <div class="sec"><h3 class="eyebrow">Bag · 눌러서 사용</h3><div id="inv"></div></div>
  <div class="sec"><h3 class="eyebrow">이 거리에 있는 사람</h3><div id="who"></div></div>
</aside>

<div id="modal"><div class="card"><div class="eyebrow" id="mEyebrow"></div><div id="mTitle">-</div><div id="mBody"></div></div></div>

<div id="login"><div class="card">
  <div id="preview"><canvas id="face" width="520" height="640"></canvas><div id="combo"></div></div>
  <div class="form">
    <div class="eyebrow">Mong City · 주민 등록</div>
    <h2>유리 빌딩 사이로,<br>오늘의 산책.</h2>
    <p>얼굴을 만들고 대화명을 정하면 몽도시 중앙광장에서 시작해요. 바닥을 눌러 걷고, 사람을 눌러 말을 걸어요.</p>
    <input id="nameIn" maxlength="8" placeholder="대화명 (8자까지)">
    <div class="opts">
      <div class="row"><button data-f="hair" data-d="-1" aria-label="이전 머리모양">‹</button><span>머리<b id="v-hair"></b></span><button data-f="hair" data-d="1" aria-label="다음 머리모양">›</button></div>
      <div class="row"><button data-f="hc" data-d="-1" aria-label="이전 머리색">‹</button><span>머리색<b id="v-hc"></b></span><button data-f="hc" data-d="1" aria-label="다음 머리색">›</button></div>
      <div class="row"><button data-f="eye" data-d="-1" aria-label="이전 눈">‹</button><span>눈<b id="v-eye"></b></span><button data-f="eye" data-d="1" aria-label="다음 눈">›</button></div>
      <div class="row"><button data-f="mouth" data-d="-1" aria-label="이전 입">‹</button><span>입<b id="v-mouth"></b></span><button data-f="mouth" data-d="1" aria-label="다음 입">›</button></div>
      <div class="row"><button data-f="skin" data-d="-1" aria-label="이전 피부">‹</button><span>피부<b id="v-skin"></b></span><button data-f="skin" data-d="1" aria-label="다음 피부">›</button></div>
      <div class="row"><button data-f="body" data-d="-1" aria-label="이전 옷">‹</button><span>옷<b id="v-body"></b></span><button data-f="body" data-d="1" aria-label="다음 옷">›</button></div>
    </div>
    <div class="actions"><button class="ghost" id="rnd">랜덤으로</button><button class="primary" id="enter">입장하기</button></div>
  </div>
</div></div>

<script>
(()=>{
'use strict';
const LW=320,LH=200;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let G=ctx,S=3,DPR=1,W=0,H=0,OX=0,OY=0,VW=LW,camX=0;
const FUI='"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const BG={key:'',c:document.createElement('canvas'),towers:[]};
function fit(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const sc=Math.min(W/LW,H/LH);
  S=Math.max(sc,Math.min(H/LH,W/(LW*.55)));
  VW=Math.min(LW,W/S);OY=(H-LH*S)/2;
  if(W<760){const dh=($('dock')?$('dock').offsetHeight:110)+28;OY=Math.max(0,H-dh-LH*S+8);}
  BG.key='';
}
addEventListener('resize',fit);

// ============ 사운드 ============
let AC=null,sndOn=true,ttsOn=false;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}return AC;}
function tone(f,d=.08,type='sine',v=.05,delay=0){
  if(!sndOn||!ac())return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const SFX={
  chat:()=>{tone(1318,.07,'sine',.035);tone(1760,.09,'sine',.025,.05);},
  door:()=>{tone(784,.35,'sine',.06);tone(1046,.45,'sine',.05,.12);},
  coin:()=>{tone(1568,.08,'triangle',.05);tone(2093,.25,'triangle',.05,.07);},
  jump:()=>{if(!sndOn||!ac())return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(900,t+.14);gn.gain.setValueAtTime(.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+.2);},
  wave:()=>{tone(880,.12,'sine',.04);tone(1175,.16,'sine',.04,.08);},
  laugh:()=>{for(let i=0;i<4;i++)tone(700+i*80,.07,'triangle',.035,i*.08);},
  cry:()=>{tone(520,.35,'sine',.05);tone(440,.45,'sine',.05,.28);},
  angry:()=>{tone(160,.18,'triangle',.07);tone(130,.22,'triangle',.07,.15);},
  love:()=>{tone(1046,.14,'sine',.05);tone(1318,.14,'sine',.05,.1);tone(1568,.3,'sine',.05,.2);},
  error:()=>tone(220,.22,'triangle',.05),
  bang:()=>{for(let i=0;i<5;i++)tone(90+Math.random()*120,.18,'triangle',.05,i*.03);},
  march:()=>{const N=[[523,.3],[698,.45],[698,.15],[698,.6],[523,.3],[784,.45],[659,.15],[698,.6],[523,.3],[698,.45],[880,.15],[1047,.45],[988,.15],[880,.3],[784,.3],[698,.6]];let t=0;N.forEach(([f,d])=>{tone(f,d*.95,'triangle',.06,t);tone(f/2,d*.95,'sine',.04,t);t+=d;});},
};
function speak(t){if(!ttsOn||!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}

// ============ 그리기 도우미 ============
function hex2(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255];}
function shade(h,k){const c=hex2(h).map(v=>k>0?v+(255-v)*k:v*(1+k));return'#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');}
function rgba(h,a){return`rgba(${hex2(h).join(',')},${a})`;}
function mix(a,b,k){const A=hex2(a),B=hex2(b);return'#'+A.map((v,i)=>Math.round(v*(1-k)+B[i]*k).toString(16).padStart(2,'0')).join('');}
function lg(x0,y0,x1,y1,...st){const g=G.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rg(x,y,r0,r1,...st){const g=G.createRadialGradient(x,y,r0,x,y,r1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));G.beginPath();G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath();}
function rr(x,y,w,h,r,f){rrp(x,y,w,h,r);G.fillStyle=f;G.fill();}
function rect(x,y,w,h,f){G.fillStyle=f;G.fillRect(x,y,w,h);}
function circ(x,y,r,f){G.beginPath();G.arc(x,y,r,0,Math.PI*2);G.fillStyle=f;G.fill();}
function ell(x,y,rx,ry,f){G.beginPath();G.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,Math.PI*2);G.fillStyle=f;G.fill();}
function poly(pts,f){G.beginPath();pts.forEach(([x,y],i)=>i?G.lineTo(x,y):G.moveTo(x,y));G.closePath();G.fillStyle=f;G.fill();}
function line(x0,y0,x1,y1,c,lw=.5){G.beginPath();G.moveTo(x0,y0);G.lineTo(x1,y1);G.strokeStyle=c;G.lineWidth=lw;G.stroke();}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function text(t,x,y,size,col,w=600,align='center',maxW){G.font=`${w} ${size}px ${FUI}`;G.fillStyle=col;G.textAlign=align;G.textBaseline='middle';if(maxW)G.fillText(t,x,y,maxW);else G.fillText(t,x,y);}

function ol(c){return shade(c,-.38);}
function fs(fill,lw=.45,stroke){G.fillStyle=fill;G.fill();G.strokeStyle=stroke||ol(typeof fill==='string'?fill:'#888888');G.lineWidth=lw;G.stroke();}

const HR=12; // 머리 반지름
function drawAv(GG,a,x,y,t){
  const prev=G;G=GG;
  const f=a.face,skin=SKIN[f.skin],hc=HAIRC[f.hc],bc=BODY[f.body],fit=OUTFIT[f.body];

  let jy=0;if(em==='jump')jy=-Math.sin((1-a.emoteT/0.7)*Math.PI)*14;

  const walk=a.walking?Math.sin(t*12):0,bob=a.walking?Math.abs(Math.cos(t*12))*.7:0;

  // 팔(뒤)
  const sw=em==='dance'?Math.sin(t*10)*3.5:walk*1.8;

  limb(-5.2,by-14.2,-7,by-8.6-sw,armC,2.7);if(fit==='tee'||fit==='dress')limb(-5.2,by-14.2,-5.9,by-12.6-sw*.3,shade(bc,-.06),3);

  if(fit==='dress'){G.lineTo(5.2,by-10.5);G.quadraticCurveTo(8.4,by-5,7.6,by-3.6);G.quadraticCurveTo(0,by-2.2,-7.6,by-3.6);G.quadraticCurveTo(-8.4,by-5,-5.2,by-10.5);}
  else{G.lineTo(5.3,by-7.4);G.quadraticCurveTo(5.3,by-6.4,4.3,by-6.4);G.lineTo(-4.3,by-6.4);G.quadraticCurveTo(-5.3,by-6.4,-5.3,by-7.4);}
  G.closePath();G.fillStyle=bc;G.fill();
  G.save();G.clip();
  rect(1.6,by-17,8,15,'rgba(60,50,90,.10)');
  if(fit==='stripe')for(let j=by-13.4;j<by-6;j+=2.2)rect(-7,j,14,.95,shade(bc,.5));
  if(fit==='jacket'){rect(-1.4,by-16,2.8,10,'#fbfaf6');}
  if(fit==='shirt')for(let j=by-12.6;j<by-7;j+=2)circ(0,j,.3,ol(bc));
  if(fit==='hoodie')rr(-3,by-10.4,6,2.6,.9,shade(bc,-.07));
  if(fit==='dress'){rect(-8,by-10.6,16,1,shade(bc,-.2));for(let i=-4.5;i<=4.5;i+=3)line(i,by-9.5,i*1.35,by-3,'rgba(0,0,0,.07)',.4);}

  if(fit==='tee'||fit==='dress')limb(5.2,by-14.2,wave?6:5.9,wave?by-15.8:by-12.6+sw*.3,bc,3);

  G.save();headPath();G.clip();G.translate(0,1.6);hairFront(f.hair,shade(skin,-.13),true);G.restore();

  const ex=dir*1.3;
  eyes(em==='laugh'||em==='love'?1:em==='cry'?6:f.eye,ex,f.eye===4?IRIS[3]:IRIS[f.hc],em==='angry');

  hairFront(f.hair,hc,false);
  if(em==='angry'||em==='cry'){G.globalAlpha=.85;brows(em,hc,ex);G.globalAlpha=1;}
  if(a.wear&&a.wear.glass){for(const sx of[-4.9,4.9]){rrp(sx+ex-3,1.1,6,4.2,2);fs('#262a33',.4,'#111');poly([[sx+ex-2,4.8],[sx+ex-.6,1.5],[sx+ex+.4,1.5],[sx+ex-1,4.8]],'rgba(255,255,255,.45)');}line(-1.9+ex,2.4,1.9+ex,2.4,'#262a33',.7);}
  if(a.wear&&a.wear.hat){G.beginPath();G.moveTo(-12.6,-4.4);G.bezierCurveTo(-12.6,-18.4,12.6,-18.4,12.6,-4.4);G.closePath();fs('#ef6b66',.45);G.save();G.clip();rect(4,-19,10,16,'rgba(0,0,0,.09)');G.restore();
    G.beginPath();G.ellipse(dir*7.5,-4.3,8.4,2,0,0,7);fs('#d9504b',.45);circ(0,-15.6,1.3,'#fbf7f0');}
  if(em==='cry'){const k=(t*2)%1;ell(-5+ex,5+k*5,.85,1.35,'rgba(110,180,245,.9)');ell(5+ex,5+((k+.5)%1)*5,.85,1.35,'rgba(110,180,245,.9)');}
  if(em==='angry'){G.font='bold 5px sans-serif';G.fillStyle='#e05a5a';G.textAlign='center';G.fillText('💢',9,-9);}
  G.restore();
  G.restore();G=prev;

}
function headPath(){G.beginPath();G.moveTo(-HR,-.5);G.bezierCurveTo(-HR-.4,-HR*1.18,HR+.4,-HR*1.18,HR,-.5);G.bezierCurveTo(HR-.2,6.4,6.4,10.6,0,10.6);G.bezierCurveTo(-6.4,10.6,-HR+.2,6.4,-HR,-.5);G.closePath();}
const HAIR_NAMES2=['바람머리','단발','긴생머리','히어로','양갈래','옆가르마','똥머리','웨이브'];
function hairFill(c,flat,back){if(flat){G.fillStyle=c;G.fill();return;}
  const base=back?shade(c,-.16):c;G.lineJoin='round';G.strokeStyle=ol(c);G.lineWidth=.9;G.stroke();
  G.fillStyle=lg(-5,-16,5,12,shade(base,.24),base,shade(base,-.12));G.fill();}
function crown(side=0,top=1.55,w=1.2){G.moveTo(-HR-w,Math.max(side,3.5));G.lineTo(-HR-w,side);G.bezierCurveTo(-HR-w-1,-HR*top,HR+w+1,-HR*top,HR+w,side);G.lineTo(HR+w,Math.max(side,3.5));}
// 앞머리 가장자리: 오른쪽 관자놀이 → 왼쪽, tips=[x,y], 홈 깊이 notch
function edge(tips,notch,sweep,endX,endY){
  let px=null;for(let i=0;i<tips.length;i++){const [tx,ty]=tips[i];
    if(px!==null){const nx=(px+tx)/2+sweep*.5;G.quadraticCurveTo(px+(nx-px)*.6,tips[i-1][1]-1.2,nx,notch);}
    G.quadraticCurveTo(tx+sweep,ty-2.6,tx,ty);px=tx;}
  G.quadraticCurveTo(px-1.6,tips[tips.length-1][1]+.6,endX,Math.max(endY,3.5));}
let LQ=[];
function lock(sx,y0,len,curl,w=2.6){LQ.push(()=>lockP(sx,y0,len,curl,w));}
function lockP(sx,y0,len,curl,w){G.moveTo(sx*(HR+.9),y0);G.bezierCurveTo(sx*(HR+2.4),len*.35,sx*(HR+1.6),len*.75,sx*(HR-curl),len);G.bezierCurveTo(sx*(HR-curl*.2-w*.5),len*.7,sx*(HR-w),len*.3,sx*(HR-w-.4),y0+2);G.closePath();}

  G.beginPath();G.moveTo(-.4,.6);G.lineTo(-1.6,3.4);G.lineTo(-.2,3);G.moveTo(.4,.6);G.lineTo(1.6,3.4);G.lineTo(.2,3);G.fillStyle=shade(c,-.1);G.fill();circ(0,.3,1,shade(c,-.15));G.restore();}

    G.beginPath();G.arc(-1.8,-HR-5.4,2.2,Math.PI*1.1,Math.PI*1.6);G.strokeStyle='rgba(255,255,255,.55)';G.lineWidth=.8;G.stroke();bow(3.6,-HR-.6,'#9fb8ff');}
}

function stepAv(a,dt){
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),sp=(a.speed||45)*dt;
  if(d>.5){a.sitting=false;a.walking=true;if(Math.abs(dx)>.3)a.dir=dx>0?1:-1;if(d<=sp){a.x=a.tx;a.y=a.ty;}else{a.x+=dx/d*sp;a.y+=dy/d*sp;}}else a.walking=false;
  if(a.emoteT>0){a.emoteT-=dt;if(a.emoteT<=0)a.emote=null;}
  if(a.bubbleT>0)a.bubbleT-=dt;
}
function update(dt){

    if(Math.random()<.12)emote(n,['wave','jump','dance','laugh'][Math.random()*4|0],false);}}
  for(const r of remotes.values()){r.x+=(r.nx-r.x)*Math.min(1,dt*8);r.y+=(r.ny-r.y)*Math.min(1,dt*8);r.walking=Math.hypot(r.nx-r.x,r.ny-r.y)>.5;if(r.walking&&Math.abs(r.nx-r.x)>.2)r.dir=r.nx>r.x?1:-1;if(r.emoteT>0)r.emoteT-=dt;if(r.bubbleT>0)r.bubbleT-=dt;if(performance.now()-r.seen>6000){remotes.delete(r.id);updWho();}}

    if(!me.walking&&pendingAct){const p=pendingAct;pendingAct=null;doAct(p);}
    if(me.walking&&R[cur].exits!==false){if(me.x<4&&nb(cur,-1,0))go(nb(cur,-1,0),'r');else if(me.x>LW-4&&nb(cur,1,0))go(nb(cur,1,0),'l');}

  const a=avAt(p);if(a){hover={label:a.name+(a.npc?' · 주민':' · 접속자'),mx:p.x,my:p.y};return;}
  for(const h of R[cur].hot)if(inR(p,h)){hover={label:h.label,mx:p.x,my:p.y};return;}});
cv.addEventListener('pointerleave',()=>hover=null);
function avAt(p){return[...npcObjs[cur],...[...remotes.values()].filter(r=>r.region===cur)].reverse().find(a=>Math.abs(p.x-a.x)<13&&p.y<a.y+3&&p.y>a.y-52);}
cv.addEventListener('pointerdown',e=>{
  if(!me)return;ac();sheet.classList.remove('open');
  const p=toLow(e),fl=R[cur].floor;
  if(R[cur].exits!==false)for(const x of exits())if(inR(p,x)){pendingAct={go:x.to,from:{l:'r',r:'l',u:'d',d:'u'}[x.side]};walkTo(x.side==='l'?2:x.side==='r'?LW-2:LW/2,x.side==='u'?fl[0]:x.side==='d'?fl[1]:me.y);return;}
  const a=avAt(p);if(a){walkTo(a.x+(me.x<a.x?-14:14),a.y);pendingAct={talk:a};return;}
  for(const h of R[cur].hot)if(inR(p,h)){walkTo(h.x+h.w/2,Math.max(fl[0]+4,Math.min(fl[1],h.y+h.h+6)));pendingAct={act:h.act};return;}
  walkTo(p.x,p.y);
});
function maxY(){const fl=R[cur].floor;const d=$('dock');if(!d)return fl[1];const top=d.getBoundingClientRect().top;return Math.max(fl[0]+20,Math.min(fl[1],(top-OY)/S-3));}
function walkTo(x,y){const fl=R[cur].floor;me.tx=Math.max(4,Math.min(LW-4,x));me.ty=Math.max(fl[0],Math.min(maxY(),y));me.sitting=false;}
addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();sheet.classList.remove('open');}if(!me||document.activeElement===chatIn||document.activeElement===$('nameIn'))return;const k={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-6],ArrowDown:[0,6]}[e.key];if(k){walkTo(me.x+k[0],me.y+k[1]);e.preventDefault();}if(e.key==='Enter'&&$('modal').style.display!=='flex'){chatIn.focus();e.preventDefault();}});

// ============ 행동 ============
function opt(attr,val,icon,label,sub){return`<button class="opt" data-${attr}="${val}"><b>${icon}</b><span>${label}${sub?`<br><em>${sub}</em>`:''}</span></button>`;}
function doAct(p){
  if(p.go){go(p.go,p.from);return;}
  if(p.talk){const a=p.talk;me.dir=a.x>me.x?1:-1;a.dir=-me.dir;
    if(me.held&&a.npc){const it=me.held;delItem(it);me.held=null;say(a,`와, ${ITEMS[it].n}! 고마워요 ♥`);emote(a,'love',false);SFX.love();updInv();return;}
    if(a.npc){say(a,['네~ 무슨 일이세요?','안녕하세요 ^^','저한테 할 말 있어요?'][Math.random()*3|0]);emote(a,'wave',false);}return;}
  const act=p.act;
  if(act==='sit'){me.sitting=true;sys('자리에 앉았어요.');}
  else if(act==='firework'){if(!pay(500,'불꽃놀이'))return;sys('불꽃놀이를 열었어요.');banner('몽도시 불꽃 축제');for(let i=0;i<7;i++)setTimeout(()=>{firework();SFX.bang();},i*450);}
  else if(act==='subway'){openModal('Line 2 · 순환선','어디로 갈까요?',`<p class="note">한 번 타는 데 300원이에요.</p><div class="list">${Object.keys(R).filter(k=>k!=='myroom'&&k!=='subway').map(k=>opt('sub',k,coord(k),R[k].name,R[k].en)).join('')}</div><button class="ghost" data-close>닫기</button>`);}
  else if(act.startsWith('go:'))go(act.slice(3),'d');
  else if(act.startsWith('shop:'))openShop(act.slice(5));
  else if(act==='atm')openAtm();
  else if(act==='job')startJob();
  else if(act==='wedding')wedding();
  else if(act==='movie'){if(MOVIE)return;if(!pay(1000,'영화표'))return;MOVIE=.01;sys('「별을 건너는 비행선」 상영을 시작해요.');tone(392,.4,'triangle',.06);tone(523,.6,'triangle',.06,.3);}
  else if(act==='sleep'){SLEEP=3;sys('잠자리에 들었어요.');}
  else if(act==='pc'){tone(1200,.1,'square',.03);tone(1600,.1,'square',.03,.12);tone(900,.3,'sawtooth',.02,.25);openModal('PC통신 · 28.8kbps','편지함',`<div class="screen">[편지함] 새 편지 2통<br>1. 몽도시 운영자 · ${esc(me.name)}님, 주민 등록을 환영해요<br>2. 길동 · 광장에서 불꽃놀이 같이 봐요 ^^<br><br>선택 &gt; _</div><p style="margin-top:14px"><button class="ghost" data-close>접속 끊기</button></p>`);}
}
function pay(n,why){if(st.wallet<n){sys(`지갑에 돈이 모자라요. ${why}에 ${n.toLocaleString()}원이 필요해요. 몽은행 ATM에서 찾을 수 있어요.`,'e');SFX.error();return false;}st.wallet-=n;updMoney();SFX.coin();save();return true;}
function firework(){const x=camX+30+Math.random()*(VW-60),y=18+Math.random()*44,c=['#ff8a7a','#ffd36a','#8ff0c6','#8cc8ff','#e6a6ff'][Math.random()*5|0];const p=[];for(let i=0;i<46;i++){const a=i/46*6.28,s=18+Math.random()*26;p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c});}fx.push({k:'fw',t:2.2,p});}
function confetti(){const p=[];for(let i=0;i<120;i++)p.push({x:Math.random()*LW,y:-Math.random()*100,vx:(Math.random()-.5)*10,vy:18+Math.random()*24,c:['#f39cb8','#ffffff','#efbe4a','#86a9cf','#b79ce0'][i%5]});fx.push({k:'cf',t:8,p});}
function openShop(k){openModal(k==='super'?'Mong Mart':'Mong Department Store',k==='super'?'몽마트':'몽백화점',`<p class="note">지갑에 <b>${st.wallet.toLocaleString()}원</b> 있어요.</p><div class="list">${SHOPS[k].map(i=>opt('buy',i,ITEMS[i].e,ITEMS[i].n,ITEMS[i].p.toLocaleString()+'원')).join('')}</div><button class="ghost" data-close>나가기</button>`);}
function addItem(i){st.inv[i]=(st.inv[i]||0)+1;updInv();save();}
function delItem(i){if(!st.inv[i])return;if(--st.inv[i]<=0){delete st.inv[i];if(me.held===i)me.held=null;}updInv();save();}
function openAtm(){openModal('Mong Bank ATM','현금인출기',`<div class="screen">통장 잔액&nbsp;&nbsp;${st.bank.toLocaleString()}원<br>지갑&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${st.wallet.toLocaleString()}원</div><div class="list">${opt('atm','-10000','↓','1만원 찾기')}${opt('atm','-50000','↓','5만원 찾기')}${opt('atm','10000','↑','1만원 넣기')}${opt('atm','all','↑','지갑 전부 넣기')}</div><button class="ghost" data-close>카드 꺼내기</button>`);}
function atm(v){if(v==='all')v=st.wallet;v=+v;if(v<0&&st.bank<-v||v>0&&st.wallet<v||v===0){SFX.error();sys('잔액이 모자라요.','e');return;}st.bank-=v;st.wallet+=v;SFX.coin();updMoney();save();sys(v<0?`${(-v).toLocaleString()}원을 찾았어요.`:`${v.toLocaleString()}원을 넣었어요.`);openAtm();}
let job=null;
function startJob(){job={round:0,ok:0};jobRound();}
function jobRound(){if(job.round>=5){const p=job.ok*1000;st.wallet+=p;updMoney();save();if(p)SFX.coin();closeModal();sys(`아르바이트를 마쳤어요. 5잔 중 ${job.ok}잔 성공, ${p.toLocaleString()}원을 받았어요.`);say(npcObjs.cafe[0],job.ok>=4?'최고예요! 또 와요~':'수고했어요 ^^');return;}
  const menu=[['☕','아메리카노'],['🍵','녹차 라떼'],['🧃','생과일 주스'],['🍰','치즈케이크'],['🥪','샌드위치'],['🧋','버블티']];
  const want=menu[Math.random()*menu.length|0];const opts=[want];while(opts.length<3){const m=menu[Math.random()*menu.length|0];if(!opts.includes(m))opts.push(m);}opts.sort(()=>Math.random()-.5);
  job.want=want[0];
  openModal(`Café Mong · ${job.round+1} / 5`,`“${want[1]} 주세요”`,`<p class="note">맞는 메뉴를 고르면 1,000원을 받아요.</p><div class="list">${opts.map(o=>opt('job',o[0],o[0],o[1])).join('')}</div>`);}
function wedding(){
  if(st.spouse){say(npcObjs.wedding[0],`${st.spouse}님과 행복하게 사세요~`);return;}
  if(!st.inv.ring){say(npcObjs.wedding[0],'결혼하려면 반지가 필요해요. 몽백화점에 가보세요!');return;}
  const cands=[...Object.values(npcObjs).flat().filter(n=>n.name!=='주례님').map(n=>n.name),...[...remotes.values()].filter(r=>r.region===cur).map(r=>r.name)];
  openModal('Lavender Hall','누구와 결혼할까요?',`<p class="note">반지 1개를 사용해요.</p><div class="list">${[...new Set(cands)].map(n=>opt('wed',esc(n),'💍',esc(n))).join('')}</div><button class="ghost" data-close>취소</button>`);}
function doWedding(name){closeModal();delItem('ring');st.spouse=name;save();updMoney();
  const ju=npcObjs.wedding[0];me.tx=150;me.ty=150;
  say(ju,'지금부터 결혼식을 시작하겠습니다.');SFX.march();
  setTimeout(()=>say(ju,'두 사람은 평생 서로 아끼겠습니까?'),2500);
  setTimeout(()=>{say(me,'네! ♥');emote(me,'love');},4500);
  setTimeout(()=>{say(ju,'두 사람이 부부가 되었음을 선언합니다!');banner(`${me.name} ♥ ${name}`,5);confetti();send({t:'chat',msg:`${name}님과 결혼했어요!`});for(const n of npcObjs[cur])emote(n,'jump',false);},6500);
  sys(`${name}님과의 결혼식이 시작돼요.`);}

function say(a,t,net=true){if(!t)return;a.bubble=t;a.bubbleT=5;chatLine(a,t);SFX.chat();if(a!==me)speak(t);if(net&&a===me)send({t:'chat',msg:t});}
function emote(a,e,net=true){if(e==='sit'){a.sitting=!a.sitting;}else{a.emote=e;a.emoteT=e==='jump'?.7:2.2;}
  if(a===me||Math.random()<.5)(SFX[e==='dance'?'wave':e]||(()=>{}))();
  const msg={wave:'손을 흔들어요',jump:'폴짝 뛰어요',sit:a.sitting?'자리에 앉아요':'일어나요',dance:'춤을 춰요',laugh:'웃어요',cry:'울어요',angry:'화를 내요',love:'하트를 보내요'}[e];
  addLog(`<span class="e">${esc(a.name)}님이 ${msg}</span>`);
  if(net&&a===me)send({t:'emote',e});}
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>me&&emote(me,b.dataset.e));
const chatIn=$('chatIn'),sheet=$('sheet');
$('bar').addEventListener('submit',e=>{e.preventDefault();const t=chatIn.value.trim();if(!t||!me)return;chatIn.value='';say(me,t);
  const near=npcObjs[cur].filter(n=>Math.hypot(n.x-me.x,n.y-me.y)<90).sort((a,b)=>Math.hypot(a.x-me.x,a.y-me.y)-Math.hypot(b.x-me.x,b.y-me.y))[0];
  if(near)setTimeout(()=>{let ans=null;for(const [re,arr] of REPLY)if(re.test(t)){ans=arr[Math.random()*arr.length|0];break;}
    if(!ans&&Math.random()<.75)ans=['그렇군요~','오, 정말요?','ㅋㅋㅋ 재밌다','음… ^^;',me.name+'님 말 잘하시네요'][Math.random()*5|0];
    if(ans){near.tx=near.x;near.ty=near.y;near.dir=me.x>near.x?1:-1;say(near,ans.replace('{n}',near.name));}},800+Math.random()*900);});
$('sndBtn').onclick=e=>{sndOn=!sndOn;e.currentTarget.classList.toggle('on',!sndOn);e.currentTarget.setAttribute('aria-label',sndOn?'효과음 끄기':'효과음 켜기');};
$('ttsBtn').onclick=e=>{ttsOn=!ttsOn;e.currentTarget.classList.toggle('on',ttsOn);sys(ttsOn?'다른 사람의 말을 소리로 읽어줘요.':'음성 읽기를 껐어요.');};
$('bagBtn').onclick=()=>sheet.classList.toggle('open');$('sheetClose').onclick=()=>sheet.classList.remove('open');

const logEl=$('log');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let idleT;function addLog(h){$('logWrap').classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>$('logWrap').classList.add('idle'),7000);const d=document.createElement('div');d.innerHTML=h;logEl.appendChild(d);while(logEl.children.length>80)logEl.firstChild.remove();logEl.scrollTop=logEl.scrollHeight;}
function sys(t,c='s'){addLog(`<span class="${c}">${esc(t)}</span>`);}
function chatLine(a,t){addLog(`<b class="${a===me?'me':a.npc?'npc':'pc'}">${esc(a.name)}</b>&nbsp; ${esc(t)}`);}
function updMoney(){$('wallet').textContent=st.wallet.toLocaleString()+'원';$('walletTop').textContent='₩'+st.wallet.toLocaleString();$('bank').textContent=st.bank.toLocaleString()+'원';$('spouseRow').hidden=!st.spouse;$('spouse').textContent=st.spouse||'';}
function updMap(){const r=R[cur];$('regionName').textContent=r.name;$('regionEn').textContent=r.en;$('coord').textContent=coord(cur)+' · MONG CITY';
  $('map').innerHTML=MAP.flat().map(id=>`<div class="${id===cur||(cur==='myroom'&&id==='house')?'cur':''}" title="${R[id].name}">${SHORT[id]||R[id].name}</div>`).join('');}
function updWho(){const list=[me,...[...remotes.values()].filter(r=>r.region===cur)].filter(Boolean);
  $('who').innerHTML=list.map(a=>`<div><i></i>${esc(a.name)}${a===me?' (나)':''}</div>`).join('')+npcObjs[cur].map(n=>`<div><i class="n"></i>${esc(n.name)} <span class="note">주민</span></div>`).join('');}
function updInv(){const ks=Object.keys(st.inv);$('inv').innerHTML=ks.length?ks.map(k=>`<button class="it${me&&(me.held===k||ITEMS[k].w&&me.wear[ITEMS[k].w])?' held':''}" data-it="${k}" title="${ITEMS[k].n}" aria-label="${ITEMS[k].n}">${ITEMS[k].e}<small>${st.inv[k]}</small></button>`).join(''):'<div class="empty">아직 비어 있어요. 몽마트나 몽백화점에서 물건을 사보세요.</div>';}
$('inv').addEventListener('click',e=>{const el=e.target.closest('[data-it]');if(!el||!me)return;const k=el.dataset.it,it=ITEMS[k];
  if(it.f){delItem(k);say(me,`${it.n} 맛있다!`);tone(500,.06,'triangle',.04);tone(640,.08,'triangle',.04,.1);return;}
  if(it.w){me.wear[it.w]=!me.wear[it.w];sys(me.wear[it.w]?`${it.n}을(를) 착용했어요.`:`${it.n}을(를) 벗었어요.`);updInv();save();return;}
  me.held=me.held===k?null:k;sys(me.held?`${it.n}을(를) 들었어요. 주민을 누르면 선물해요.`:`${it.n}을(를) 내려놓았어요.`);updInv();});
function openModal(eb,t,h){$('mEyebrow').textContent=eb;$('mTitle').textContent=t;$('mBody').innerHTML=h;$('modal').style.display='flex';}
function closeModal(){$('modal').style.display='none';}
$('modal').addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='modal'){closeModal();return;}if(!b)return;
  if(b.dataset.close!==undefined)closeModal();
  if(b.dataset.buy){const i=b.dataset.buy;if(pay(ITEMS[i].p,ITEMS[i].n)){addItem(i);sys(`${ITEMS[i].n}을(를) 샀어요.`);openShop(SHOPS.super.includes(i)?'super':'dept');}}
  if(b.dataset.atm)atm(b.dataset.atm);
  if(b.dataset.job){if(b.dataset.job===job.want){job.ok++;SFX.coin();}else SFX.error();job.round++;jobRound();}
  if(b.dataset.sub){if(pay(300,'지하철')){closeModal();sys('지하철을 탔어요.');tone(300,.4,'triangle',.03);setTimeout(()=>go(b.dataset.sub,'d'),600);}}
  if(b.dataset.wed)doWedding(b.dataset.wed);
});

const bc=('BroadcastChannel' in window)?new BroadcastChannel('mongcity'):null;
function send(m){if(bc&&me)bc.postMessage({...m,id:myId,name:me.name});}
if(bc)bc.onmessage=({data:m})=>{if(!me||m.id===myId)return;let r=remotes.get(m.id);
  if(!r){if(m.t!=='pos')return;r=mkAv({id:m.id,name:m.name,face:m.face,x:m.x,y:m.y,nx:m.x,ny:m.y,region:m.region});remotes.set(m.id,r);sys(`${m.name}님이 들어왔어요.`);SFX.door();}
  r.seen=performance.now();
  if(m.t==='pos'){if(r.region!==m.region){r.x=m.x;r.y=m.y;}r.region=m.region;r.nx=m.x;r.ny=m.y;r.sitting=m.sit;r.held=m.held;r.wear=m.wear||{};r.face=m.face;updWho();}
  if(m.t==='chat'&&r.region===cur)say(r,m.msg,false);
  if(m.t==='emote'&&r.region===cur)emote(r,m.e,false);

const face={hair:0,hc:0,eye:0,mouth:0,skin:0,body:0};
const LIM={hair:HAIRN,hc:HAIRC.length,eye:EYEN,mouth:MOUTHN,skin:SKIN.length,body:BODY.length};
const fc=$('face'),fg=fc.getContext('2d');
function drawFace(){
  const w=fc.width,h=fc.height;fg.setTransform(1,0,0,1,0,0);fg.clearRect(0,0,w,h);
  const sc=Math.min(w/50,h/62);fg.setTransform(sc,0,0,sc,(w-50*sc)/2,(h-62*sc)/2);
  drawAv(fg,mkAv({face}),25,56,0);
  for(const k in LIM)$('v-'+k).textContent=k==='hair'?HAIR_NAMES[face[k]]:`${face[k]+1}/${LIM[k]}`;
  $('combo').textContent=`${(HAIRN*HAIRC.length*EYEN*MOUTHN*SKIN.length*BODY.length).toLocaleString()} COMBINATIONS`;}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f;face[k]=(face[k]+ +b.dataset.d+LIM[k])%LIM[k];drawFace();tone(1400,.04,'sine',.03);});
$('rnd').onclick=()=>{for(const k in LIM)face[k]=Math.random()*LIM[k]|0;drawFace();};

if(sv&&sv.face){Object.assign(face,sv.face);$('nameIn').value=sv.name||'';if(sv.st)Object.assign(st,sv.st);}else $('rnd').onclick();

  ac();updMoney();updMap();updWho();updInv();save();
