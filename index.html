<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>몽도시 97</title>
<style>
:root{--gray:#c0c0c0;--dark:#808080;--light:#fff;--navy:#000080;--bg:#008080}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:"Galmuri11","DungGeunMo","Gulim","굴림","Dotum","돋움",monospace;font-size:13px;color:#000;overflow:hidden}
.win{background:var(--gray);border:2px solid;border-color:var(--light) #000 #000 var(--light);box-shadow:inset -1px -1px var(--dark),inset 1px 1px #dfdfdf}
.title{background:linear-gradient(90deg,var(--navy),#1084d0);color:#fff;font-weight:bold;padding:3px 6px;display:flex;align-items:center;gap:6px}
.title span{margin-left:auto;font-weight:normal;font-size:12px}
.btn{font:inherit;background:var(--gray);border:2px solid;border-color:var(--light) #000 #000 var(--light);box-shadow:inset -1px -1px var(--dark);padding:3px 8px;cursor:pointer;color:#000;white-space:nowrap}
.btn:active,.btn.on{border-color:#000 var(--light) var(--light) #000;box-shadow:inset 1px 1px var(--dark)}
.sunk{background:#fff;border:2px solid;border-color:var(--dark) var(--light) var(--light) var(--dark)}
#app{position:fixed;inset:6px;display:grid;grid-template-columns:1fr 230px;grid-template-rows:auto 1fr auto;gap:6px}
#main{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;margin:4px}
canvas#c{image-rendering:pixelated;touch-action:none;cursor:pointer}
#side{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;min-height:0}
#side .sec{margin:4px;padding:6px}
#side h4{font-size:12px;margin-bottom:4px}
#map{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
#map div{font-size:10px;text-align:center;padding:4px 0;background:#d8d8d8;border:1px solid var(--dark)}
#map div.cur{background:var(--navy);color:#fff}
#money div{display:flex;justify-content:space-between;padding:1px 0}
#inv{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-height:150px;overflow:auto}
#inv .it{font-size:20px;text-align:center;padding:3px 0;cursor:pointer;background:#e8e8e8;border:1px solid var(--dark);position:relative}
#inv .it small{position:absolute;right:1px;bottom:0;font-size:9px}
#inv .it.held{background:#ffff9c}
#who{font-size:12px;max-height:120px;overflow:auto}
#chatBox{grid-column:1;grid-row:3;display:flex;flex-direction:column}
#log{height:110px;overflow-y:auto;margin:4px;padding:3px 6px;font-size:12px;line-height:1.45}
#log .s{color:#008000}#log .e{color:#800080}
#bar{display:flex;gap:4px;margin:0 4px 4px;flex-wrap:wrap}
#chatIn{flex:1;min-width:120px;font:inherit;padding:3px 5px;outline:none}
#emotes{display:flex;gap:3px;margin:0 4px 4px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal .win{width:min(380px,100%);max-height:90vh;overflow:auto}
.modal .body{padding:10px}
.shopList{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin:8px 0}
.shopList .btn{display:flex;align-items:center;gap:6px;text-align:left;white-space:normal}
.shopList .btn b{font-size:22px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30;padding:10px}
#login .win{width:min(420px,100%)}
#login .body{padding:12px;display:grid;grid-template-columns:120px 1fr;gap:10px}
#face{width:120px;height:150px;image-rendering:pixelated;background:#9cf}
.row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:5px}
.row .btn{padding:1px 7px}
#nameIn{width:100%;font:inherit;padding:4px;margin-bottom:8px}
.logo{font-size:28px;font-weight:bold;color:var(--navy);text-shadow:2px 2px #fff;letter-spacing:2px;text-align:center;grid-column:1/3}
@media (max-width:720px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto;overflow:auto;inset:0}
  html,body{overflow:auto}
  #main{grid-row:1;grid-column:1}#chatBox{grid-row:2}#side{grid-row:3;grid-column:1}
  #stageWrap{flex:none}#log{height:80px}
}
</style>
</head>
<body>
<div id="app">
  <div id="main" class="win">
    <div class="title">🏙 몽도시 '97 — <b id="regionName">중앙광장</b><span id="clock"></span></div>
    <div id="stageWrap"><canvas id="c"></canvas></div>
  </div>
  <div id="chatBox" class="win">
    <div id="log" class="sunk"></div>
    <div id="emotes">
      <button class="btn" data-e="wave">👋 인사</button><button class="btn" data-e="jump">⤴ 점프</button>
      <button class="btn" data-e="sit">🪑 앉기</button><button class="btn" data-e="dance">💃 춤</button>
      <button class="btn" data-e="laugh">😆 웃음</button><button class="btn" data-e="cry">😭 울음</button>
      <button class="btn" data-e="angry">💢 화남</button><button class="btn" data-e="love">💗 사랑</button>
    </div>
    <form id="bar"><input id="chatIn" class="sunk" maxlength="60" placeholder="대화를 입력하세요 (Enter)" autocomplete="off"><button class="btn">말하기</button><button type="button" class="btn" id="sndBtn">🔊</button><button type="button" class="btn" id="ttsBtn" title="채팅을 음성으로 읽기">🗣 음성</button></form>
  </div>
  <div id="side" class="win">
    <div class="title">📋 내 정보</div>
    <div class="sec"><h4 id="myName">-</h4>
      <div id="money" class="sunk" style="padding:4px"><div><span>💵 지갑</span><b id="wallet">0원</b></div><div><span>🏦 통장</span><b id="bank">0원</b></div><div id="spouseRow" style="display:none"><span>💍 배우자</span><b id="spouse"></b></div></div>
    </div>
    <div class="sec"><h4>🗺 도시 지도</h4><div id="map"></div></div>
    <div class="sec"><h4>🎒 소지품 <small>(클릭=사용/들기)</small></h4><div id="inv" class="sunk" style="padding:3px"></div></div>
    <div class="sec" style="flex:1;min-height:0"><h4>👥 이 지역 사람들</h4><div id="who" class="sunk" style="padding:4px"></div></div>
  </div>
</div>

<div class="modal" id="modal"><div class="win"><div class="title" id="mTitle">-</div><div class="body" id="mBody"></div></div></div>

<div id="login"><div class="win">
  <div class="title">💾 몽도시 '97 접속 프로그램 v1.0</div>
  <div class="body">
    <div class="logo">몽도시 '97</div>
    <div><canvas id="face" width="40" height="50"></canvas><div style="font-size:11px;text-align:center;margin-top:4px" id="combo"></div></div>
    <div>
      <input id="nameIn" class="sunk" maxlength="8" placeholder="대화명 (8자)">
      <div class="row"><button class="btn" data-f="hair" data-d="-1">◀</button>머리모양<button class="btn" data-f="hair" data-d="1">▶</button></div>
      <div class="row"><button class="btn" data-f="hc" data-d="-1">◀</button>머리색<button class="btn" data-f="hc" data-d="1">▶</button></div>
      <div class="row"><button class="btn" data-f="eye" data-d="-1">◀</button>눈<button class="btn" data-f="eye" data-d="1">▶</button></div>
      <div class="row"><button class="btn" data-f="mouth" data-d="-1">◀</button>입<button class="btn" data-f="mouth" data-d="1">▶</button></div>
      <div class="row"><button class="btn" data-f="skin" data-d="-1">◀</button>피부<button class="btn" data-f="skin" data-d="1">▶</button></div>
      <div class="row"><button class="btn" data-f="body" data-d="-1">◀</button>옷<button class="btn" data-f="body" data-d="1">▶</button></div>
      <div class="row"><button class="btn" id="rnd">🎲 랜덤</button><button class="btn" id="enter" style="font-weight:bold">접속하기 ▶</button></div>
    </div>
  </div>
</div></div>

<script>
(()=>{
'use strict';
const LW=320,LH=200;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const low=document.createElement('canvas');low.width=LW;low.height=LH;const g=low.getContext('2d');
let S=2,DPR=1;
function fit(){
  const w=$('stageWrap');DPR=Math.min(devicePixelRatio||1,2);
  const aw=w.clientWidth||innerWidth-20, ah=w.clientHeight>60?w.clientHeight:aw*LH/LW;
  S=Math.max(1,Math.min(aw/LW,ah/LH));
  cv.style.width=LW*S+'px';cv.style.height=LH*S+'px';cv.width=Math.round(LW*S*DPR);cv.height=Math.round(LH*S*DPR);
}
addEventListener('resize',fit);

// ============ 사운드 (8비트 효과음) ============
let AC=null,sndOn=true,ttsOn=false;
function tone(f,d=.08,type='square',v=.06,delay=0){
  if(!sndOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
const SFX={
  chat:()=>{tone(880,.04);tone(1320,.04,'square',.05,.05);},
  door:()=>{tone(660,.12,'triangle',.1);tone(880,.18,'triangle',.1,.12);},
  coin:()=>{tone(988,.06);tone(1319,.2,'square',.06,.06);},
  jump:()=>{if(!sndOn||!AC&&!(AC=new (window.AudioContext||window.webkitAudioContext)()))return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(880,t+.15);gn.gain.setValueAtTime(.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(gn).connect(AC.destination);o.start(t);o.stop(t+.2);},
  wave:()=>{tone(784,.06);tone(988,.06,'square',.05,.07);tone(1175,.1,'square',.05,.14);},
  laugh:()=>{for(let i=0;i<4;i++)tone(600+i*60,.05,'square',.05,i*.08);},
  cry:()=>{tone(500,.25,'triangle',.08);tone(420,.35,'triangle',.08,.25);},
  angry:()=>{tone(120,.15,'sawtooth',.07);tone(100,.2,'sawtooth',.07,.15);},
  love:()=>{tone(1047,.1,'sine',.08);tone(1319,.1,'sine',.08,.1);tone(1568,.2,'sine',.08,.2);},
  error:()=>tone(150,.2,'square',.06),
  bang:()=>{for(let i=0;i<6;i++)tone(80+Math.random()*200,.1,'sawtooth',.05,i*.02);},
  march:()=>{const N=[[523,.3],[698,.45],[698,.15],[698,.6],[523,.3],[784,.45],[659,.15],[698,.6],[523,.3],[698,.45],[880,.15],[1047,.45],[988,.15],[880,.3],[784,.3],[698,.6]];let t=0;N.forEach(([f,d])=>{tone(f,d*.9,'triangle',.09,t);tone(f/2,d*.9,'square',.03,t);t+=d;});},
};
function speak(t){if(!ttsOn||!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=1.1;speechSynthesis.speak(u);}catch(e){}}

// ============ 얼굴/아바타 ============
const SKIN=['#ffdcb4','#f0c090','#c88850'];
const HAIRC=['#202020','#6b3a1a','#c87830','#f0d050','#d04040','#5050d0','#a0a0a0','#e080c0'];
const BODY=['#e03030','#3060e0','#20a040','#f0c020','#a040c0','#f08020','#20b0b0','#ffffff','#404040','#ff80b0'];
const HAIRN=8,EYEN=6,MOUTHN=6;
const OUT='#201010';
function px(c,x,y,w=1,h=1,G=g){G.fillStyle=c;G.fillRect(x|0,y|0,w,h);}
// x,y = 발 위치
function drawAv(G,a,x,y,t){
  const f=a.face,skin=SKIN[f.skin],hc=HAIRC[f.hc],bc=BODY[f.body];
  const em=a.emoteT>0?a.emote:null;
  let jy=0;if(em==='jump')jy=-Math.round(Math.sin((1-a.emoteT/0.7)*Math.PI)*14);
  if(em==='dance')jy=-Math.abs(Math.round(Math.sin(t*12)*3));
  const sit=a.sitting;
  const walk=a.walking?Math.floor(t*8)%2:0;
  const dir=a.dir;
  // 그림자
  G.fillStyle='rgba(0,0,0,.35)';G.fillRect(x-6,y-1,12,2);G.fillRect(x-4,y-2,8,4);
  y+=jy;const by=sit?y-4:y;
  // 다리
  if(sit){px(OUT,x-5,by-3,10,3,G);px('#304080',x-4,by-3,8,2,G);}
  else{px(OUT,x-4,y-7,3,7,G);px(OUT,x+1,y-7,3,7,G);px('#304080',x-3,y-7+(walk?1:0),2,6-(walk?1:0),G);px('#304080',x+2,y-7+(walk?0:1),2,6-(walk?0:1),G);
    px('#402010',x-4,y-1+(walk?0:0),3,1,G);px('#402010',x+1,y-1,3,1,G);}
  // 몸
  const top=by-17;
  px(OUT,x-6,top,12,11,G);px(bc,x-5,top+1,10,9,G);px('rgba(0,0,0,.15)',x-5,top+8,10,2,G);
  // 팔
  const wave=em==='wave'||em==='love'&&Math.floor(t*4)%2;
  const dance=em==='dance'?Math.round(Math.sin(t*12)*3):0;
  px(OUT,x-8,top+1+dance,3,8,G);px(skin,x-7,top+7+dance,1,2,G);px(bc,x-7,top+2+dance,1,5,G);
  if(wave){px(OUT,x+5,top-6,3,8,G);px(skin,x+6,top-5,1,2,G);px(bc,x+6,top-3,1,4,G);}
  else{px(OUT,x+5,top+1-dance,3,8,G);px(skin,x+6,top+7-dance,1,2,G);px(bc,x+6,top+2-dance,1,5,G);}
  // 머리
  const hx=x-7,hy=top-14;
  px(OUT,hx,hy,14,14,G);px(skin,hx+1,hy+1,12,12,G);
  drawHair(G,f.hair,hc,hx,hy);
  const ex=dir<0?-1:dir>0?1:0;
  drawEyes(G,em==='laugh'?1:em==='cry'?6:em==='angry'?7:f.eye,hx+3+ex,hy+6);
  drawMouth(G,em==='laugh'?1:em==='cry'?2:em==='angry'?2:em==='love'?0:f.mouth,hx+5+ex,hy+10);
  px('rgba(255,90,90,.45)',hx+2,hy+9,2,1,G);px('rgba(255,90,90,.45)',hx+10,hy+9,2,1,G);
  if(a.wear&&a.wear.glass){px('#000',hx+2+ex,hy+5,10,3,G);px('#4060ff',hx+3+ex,hy+6,3,1,G);px('#4060ff',hx+8+ex,hy+6,3,1,G);}
  if(a.wear&&a.wear.hat){px(OUT,hx-1,hy+1,16,2,G);px('#d03030',hx,hy+1,14,1,G);px(OUT,hx+2,hy-4,10,5,G);px('#d03030',hx+3,hy-3,8,4,G);px('#fff',hx+3,hy-1,8,1,G);}
  if(em==='cry'&&Math.floor(t*6)%2){px('#40a0ff',hx+3,hy+9,1,2,G);px('#40a0ff',hx+10,hy+9,1,2,G);}
  return {hx:x,hy:hy-2};
}
function drawHair(G,s,c,hx,hy){
  const p=(x,y,w,h)=>px(c,hx+x,hy+y,w,h,G);
  switch(s){
    case 0:p(1,0,12,3);p(0,1,1,5);p(13,1,1,5);break; // 단정
    case 1:p(1,0,12,4);p(0,1,2,10);p(12,1,2,10);p(0,10,2,4);p(12,10,2,4);break; // 단발
    case 2:p(0,0,14,3);p(0,2,1,12);p(13,2,1,12);p(-1,6,2,10);p(13,6,2,10);break; // 긴머리
    case 3:p(2,-2,2,3);p(5,-3,2,4);p(8,-2,2,3);p(11,-1,2,2);p(1,0,12,3);break; // 뾰족
    case 4:p(1,0,12,3);p(-2,1,3,4);p(13,1,3,4);break; // 양갈래
    case 5:p(0,-1,14,4);p(1,3,5,1);break; // 앞머리 옆
    case 6:p(3,-1,8,2);p(5,-3,4,2);break; // 대머리+상투
    case 7:p(-1,-1,16,5);p(-1,3,2,6);p(13,3,2,6);break; // 뽀글
  }
}
function drawEyes(G,s,x,y){
  const p=(dx,dy,w=1,h=1,c='#000')=>px(c,x+dx,y+dy,w,h,G);
  switch(s){
    case 0:p(0,0,2,2);p(6,0,2,2);break;
    case 1:p(0,0);p(1,-1);p(2,0);p(6,0);p(7,-1);p(8,0);break; // ^^
    case 2:p(0,0,2,1);p(6,0,2,1);break; // --
    case 3:p(-1,-1,3,3);p(0,0,1,1,'#fff');p(5,-1,3,3);p(6,0,1,1,'#fff');break; // 왕눈
    case 4:p(0,0,1,2);p(7,0,1,2);break; // 점
    case 5:p(-1,-1,4,3,'#000');p(0,0,2,1,'#88f');p(5,-1,4,3,'#000');p(6,0,2,1,'#88f');break; // 안경
    case 6:p(0,1);p(1,0);p(2,1);p(6,1);p(7,0);p(8,1);break; // ㅠ
    case 7:p(0,-1);p(1,0,2,1);p(7,-1);p(5,0,2,1);break; // 화남
  }
}
function drawMouth(G,s,x,y){
  const p=(dx,dy,w=1,h=1,c='#601010')=>px(c,x+dx,y+dy,w,h,G);
  switch(s){
    case 0:p(0,0);p(1,1,2,1);p(3,0);break;
    case 1:p(0,0,4,2);p(1,1,2,1,'#f06060');break;
    case 2:p(0,1);p(1,0,2,1);p(3,1);break;
    case 3:p(1,0,2,2);break;
    case 4:p(0,0,4,1);break;
    case 5:p(0,0,4,1);p(2,1,1,1,'#f06060');break;
  }
}

// ============ 지역 ============
const MAP=[['beach','park','wedding','theater'],['house','plaza','street','subway'],['cafe','super','bank','dept']];
const R={};
function region(id,name,o){R[id]=Object.assign({id,name,floor:[132,192],hot:[],npcs:[]},o);}
function pos(id){for(let y=0;y<3;y++)for(let x=0;x<4;x++)if(MAP[y][x]===id)return{x,y};return null;}
function nb(id,dx,dy){const p=pos(id);if(!p)return null;const r=MAP[p.y+dy];return r?r[p.x+dx]||null:null;}

// 배경 도우미
function sky(top,bot,h=130){for(let y=0;y<h;y++){const k=y/h;px(lerp(top,bot,k),0,y,LW,1);}}
function lerp(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const m=s=>Math.round(((A>>s)&255)*(1-k)+((B>>s)&255)*k);return`rgb(${m(16)},${m(8)},${m(0)})`;}
function dither(x,y,w,h,c1,c2){px(c1,x,y,w,h);g.fillStyle=c2;for(let j=0;j<h;j++)for(let i=(j%2);i<w;i+=2)g.fillRect(x+i,y+j,1,1);}
function bld(x,y,w,h,c,wc='#80d0ff',lit=0){px(OUT,x-1,y-1,w+2,h+1);px(c,x,y,w,h);px('rgba(255,255,255,.2)',x,y,2,h);
  for(let j=y+4;j<y+h-6;j+=8)for(let i=x+4;i<x+w-5;i+=7){px((lit&&((i*7+j*3)%5<2))?'#ffe070':wc,i,j,4,5);px('rgba(255,255,255,.5)',i,j,1,2);}}
function glassBld(x,y,w,h,c){px(OUT,x-1,y-1,w+2,h+1);for(let j=0;j<h;j++)px(lerp(c,'#e0f8ff',j/h*.6),x,y+j,w,1);

  for(const s of SIGNS){ctx.fillStyle=s.fg;ctx.font=`bold ${Math.min(s.h*.9,9)}px Gulim,Dotum,sans-serif`;ctx.fillText(s.txt,s.x+s.w/2,s.y+s.h/2+.5,s.w-1);}
  // 출구 화살표
  if(R[cur].exits!==false){ctx.font='bold 7px sans-serif';
    for(const e of exits()){ctx.fillStyle='rgba(0,0,128,.8)';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.strokeStyle='#fff';ctx.lineWidth=.5;ctx.strokeRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#ff0';ctx.fillText(e.label,e.x+e.w/2,e.y+e.h/2+.5);}}
  for(const [a,h] of heads){
    ctx.font='bold 6.5px Gulim,Dotum,sans-serif';const nm=a.name+(a===me?'':'' ),w=ctx.measureText(nm).width+4;
    ctx.fillStyle=a===me?'rgba(255,255,0,.9)':a.npc?'rgba(255,255,255,.85)':'rgba(120,255,255,.9)';ctx.fillRect(a.x-w/2,a.y+2,w,7.5);ctx.fillStyle='#000';ctx.fillText(nm,a.x,a.y+6);
    if(a.held){ctx.font='9px sans-serif';ctx.fillText(ITEMS[a.held].e,a.x+10,h.hy+16);}
    if(a.emoteT>0&&a.emote==='love'){ctx.font='8px sans-serif';ctx.globalAlpha=Math.min(1,a.emoteT);ctx.fillText('💗',a.x+Math.sin(T*6)*4,h.hy-6-(2-a.emoteT)*8);ctx.globalAlpha=1;}
    if(a.emoteT>0&&a.emote==='angry'){ctx.font='8px sans-serif';ctx.fillText('💢',a.x+8,h.hy+2);}
    if(a.bubble&&a.bubbleT>0){
      ctx.font='7px Gulim,Dotum,sans-serif';const ls=wrapT(a.bubble,80),bw=Math.max(...ls.map(l=>ctx.measureText(l).width))+6,bh=ls.length*8+4;
      let bx=Math.max(1,Math.min(LW-bw-1,a.x-bw/2)),by=h.hy-bh-4;if(by<1)by=1;
      ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=.6;ctx.fillRect(bx,by,bw,bh);ctx.strokeRect(bx,by,bw,bh);
      ctx.beginPath();ctx.moveTo(a.x-2,by+bh);ctx.lineTo(a.x,by+bh+3);ctx.lineTo(a.x+2,by+bh);ctx.fill();
      ctx.fillStyle='#000';ls.forEach((l,i)=>ctx.fillText(l,bx+bw/2,by+6+i*8));
    }
  }
  if(hover){ctx.font='bold 7px Gulim,sans-serif';const w=ctx.measureText(hover.label).width+8;const x=Math.min(LW-w-2,Math.max(2,hover.mx-w/2)),y=Math.max(2,hover.my-14);
    ctx.fillStyle='#ffffe1';ctx.fillRect(x,y,w,10);ctx.strokeStyle='#000';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,10);ctx.fillStyle='#000';ctx.fillText(hover.label,x+w/2,y+5.5);}
  if(BANNER){ctx.globalAlpha=Math.min(1,BANNER.t);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,80,LW,26);ctx.fillStyle='#ff0';ctx.font='bold 11px Gulim,sans-serif';ctx.fillText(BANNER.txt,LW/2,93.5);ctx.globalAlpha=1;}
}
function wrapT(t,max){const o=[];let c='';for(const ch of t){if(ctx.measureText(c+ch).width>max){o.push(c);c=ch;}else c+=ch;}if(c)o.push(c);return o.slice(0,4);}
let BANNER=null,SLEEP=0,hover=null;
function banner(t,d=3){BANNER={txt:t,t:d};}
function exits(){const L=[],fl=R[cur].floor;
  const l=nb(cur,-1,0),r=nb(cur,1,0),u=nb(cur,0,-1),d=nb(cur,0,1);
  if(l)L.push({x:1,y:fl[0]+14,w:44,h:10,label:'◀ '+R[l].name,to:l,side:'l'});
  if(r)L.push({x:LW-45,y:fl[0]+14,w:44,h:10,label:R[r].name+' ▶',to:r,side:'r'});
  if(u)L.push({x:LW/2-26,y:fl[0]-11,w:52,h:9,label:'▲ '+R[u].name,to:u,side:'u'});
  if(d)L.push({x:LW/2-26,y:LH-10,w:52,h:9,label:'▼ '+R[d].name,to:d,side:'d'});
  return L;}

// ============ 업데이트 ============
let netT=0,pendingAct=null;
function stepAv(a,dt){
  const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy),sp=(a.speed||45)*dt;
  if(d>.5){a.sitting=false;a.walking=true;if(Math.abs(dx)>.3)a.dir=dx>0?1:-1;if(d<=sp){a.x=a.tx;a.y=a.ty;}else{a.x+=dx/d*sp;a.y+=dy/d*sp;}}else a.walking=false;
  if(a.emoteT>0){a.emoteT-=dt;if(a.emoteT<=0&&a.emote!=='sit')a.emote=null;}
  if(a.bubbleT>0)a.bubbleT-=dt;
}
function update(dt){
  for(const n of npcObjs[cur]){stepAv(n,dt);n.think-=dt;if(n.think<=0){n.think=3+Math.random()*6;const fl=R[cur].floor;
    if(Math.random()<.6){n.tx=20+Math.random()*280;n.ty=fl[0]+6+Math.random()*(fl[1]-fl[0]-8);}
    if(Math.random()<.35)say(n,NPC_LINES[Math.random()*NPC_LINES.length|0],false);
    if(Math.random()<.12){emote(n,['wave','jump','dance','laugh'][Math.random()*4|0],false);}}}
  for(const r of remotes.values()){r.x+=(r.nx-r.x)*Math.min(1,dt*8);r.y+=(r.ny-r.y)*Math.min(1,dt*8);r.walking=Math.hypot(r.nx-r.x,r.ny-r.y)>.5;if(r.walking&&Math.abs(r.nx-r.x)>.2)r.dir=r.nx>r.x?1:-1;if(r.emoteT>0)r.emoteT-=dt;if(r.bubbleT>0)r.bubbleT-=dt;if(performance.now()-r.seen>6000){remotes.delete(r.id);updWho();}}
  if(me){stepAv(me,dt);
    if(!me.walking&&pendingAct){const p=pendingAct;pendingAct=null;doAct(p);}
    if(me.walking&&R[cur].exits!==false){if(me.x<4&&nb(cur,-1,0))go(nb(cur,-1,0),'r');else if(me.x>LW-4&&nb(cur,1,0))go(nb(cur,1,0),'l');}
    netT-=dt;if(netT<=0){netT=.2;send({t:'pos',region:cur,x:me.x,y:me.y,sit:me.sitting,held:me.held,wear:me.wear,face:me.face});}}
  if(BANNER){BANNER.t-=dt;if(BANNER.t<=0)BANNER=null;}
  if(MOVIE){MOVIE+=dt;if(MOVIE>12){MOVIE=0;sys('영화가 끝났습니다. 재미있었나요?');}}
  if(SLEEP>0){SLEEP-=dt;if(SLEEP<=0)sys('푹 잤습니다! 상쾌한 아침이에요.');}
}
function go(to,from){
  cur=to;const fl=R[to].floor;
  me.x=me.tx=from==='l'?14:from==='r'?LW-14:LW/2;me.y=me.ty=from==='u'?fl[0]+6:from==='d'?fl[1]-4:Math.max(fl[0]+20,Math.min(fl[1]-4,me.y));
  me.sitting=false;MOVIE=0;pendingAct=null;SFX.door();sys(`[${R[to].name}]에 들어왔습니다.`);updMap();updWho();
  if(npcObjs[to].length&&Math.random()<.6)setTimeout(()=>{const n=npcObjs[to][0];if(n&&cur===to)say(n,['어서오세요~','안녕하세요!',me.name+'님 방가워요 ^^'][Math.random()*3|0]);},800);
}

// ============ 입력 ============
function toLow(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};}
function inR(p,h){return p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h;}
cv.addEventListener('pointermove',e=>{if(!me)return;const p=toLow(e);hover=null;
  const a=avAt(p);if(a){hover={label:a.name+(a.npc?' (주민)':' (접속자)'),mx:p.x,my:p.y};return;}
  for(const h of R[cur].hot)if(inR(p,h)){hover={label:h.label,mx:p.x,my:p.y};return;}});
cv.addEventListener('pointerleave',()=>hover=null);
function avAt(p){return[...npcObjs[cur],...[...remotes.values()].filter(r=>r.region===cur)].reverse().find(a=>Math.abs(p.x-a.x)<8&&p.y<a.y+2&&p.y>a.y-32);}
cv.addEventListener('pointerdown',e=>{
  if(!me)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(_){}
  const p=toLow(e),fl=R[cur].floor;
  if(R[cur].exits!==false)for(const x of exits())if(inR(p,x)){const tx=x.side==='l'?2:x.side==='r'?LW-2:me.x;pendingAct={go:x.to,from:{l:'r',r:'l',u:'d',d:'u'}[x.side]};walkTo(x.side==='u'?LW/2:x.side==='d'?LW/2:tx,x.side==='u'?fl[0]:x.side==='d'?fl[1]:me.y);return;}
  const a=avAt(p);if(a){walkTo(a.x+(me.x<a.x?-14:14),a.y);pendingAct={talk:a};return;}
  for(const h of R[cur].hot)if(inR(p,h)){walkTo(h.x+h.w/2,Math.max(fl[0]+4,Math.min(fl[1],h.y+h.h+6)));pendingAct={act:h.act};return;}
  walkTo(p.x,p.y);
});
function walkTo(x,y){const fl=R[cur].floor;me.tx=Math.max(4,Math.min(LW-4,x));me.ty=Math.max(fl[0],Math.min(fl[1],y));me.sitting=false;if(me.emote==='sit')me.emote=null;}
addEventListener('keydown',e=>{if(!me||document.activeElement===chatIn)return;const k={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,-6],ArrowDown:[0,6]}[e.key];if(k){walkTo(me.x+k[0],me.y+k[1]);e.preventDefault();}if(e.key==='Enter'){chatIn.focus();e.preventDefault();}});

// ============ 행동 ============
function doAct(p){
  if(p.go){go(p.go,p.from);return;}
  if(p.talk){const a=p.talk;me.dir=a.x>me.x?1:-1;a.dir=-me.dir;
    if(me.held&&a.npc){const it=me.held;delItem(it);me.held=null;say(a,`와! ${ITEMS[it].n} 고마워요 ♥`);emote(a,'love',false);SFX.love();updInv();return;}
    say(a,a.npc?['네~ 무슨 일이세요?','안녕하세요 ^^','저한테 할 말 있어요?'][Math.random()*3|0]:'');if(a.npc)emote(a,'wave',false);return;}
  const act=p.act;
  if(act==='sit'){me.sitting=true;sys('자리에 앉았습니다.');}
  else if(act==='firework'){if(!pay(500,'불꽃놀이'))return;sys('🎆 불꽃놀이 축제가 시작됩니다!');banner('🎆 몽도시 불꽃 축제 🎆');for(let i=0;i<6;i++)setTimeout(()=>{firework();SFX.bang();},i*500);}
  else if(act==='subway'){openModal('🚇 지하철 노선도',`<p>어디로 갈까요? (요금 300원)</p><div class="shopList">${Object.keys(R).filter(k=>k!=='myroom'&&k!=='subway').map(k=>`<button class="btn" data-sub="${k}">🚉 ${R[k].name}</button>`).join('')}</div><button class="btn" data-close>닫기</button>`);}
  else if(act.startsWith('go:')){go(act.slice(3),'d');}
  else if(act.startsWith('shop:'))openShop(act.slice(5));
  else if(act==='atm')openAtm();
  else if(act==='job')startJob();
  else if(act==='wedding')wedding();
  else if(act==='movie'){if(MOVIE)return;if(!pay(1000,'영화표'))return;MOVIE=.01;sys('🎬 영화 "별을 건너는 비행선" 상영 시작!');tone(392,.3,'triangle',.08);tone(523,.5,'triangle',.08,.3);}
  else if(act==='sleep'){SLEEP=3;sys('쿨쿨... 💤');}
}
function pay(n,why){if(st.wallet<n){sys(`돈이 부족해요! (${why} ${n.toLocaleString()}원) 은행 ATM에서 돈을 찾으세요.`,'e');SFX.error();return false;}st.wallet-=n;updMoney();SFX.coin();save();return true;}
function firework(){const x=60+Math.random()*200,y=20+Math.random()*50,c=['#ff4040','#ffe040','#40ff80','#40c0ff','#ff80ff'][Math.random()*5|0];const p=[];for(let i=0;i<40;i++){const a=i/40*6.28,s=20+Math.random()*30;p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c});}fx.push({k:'fw',t:2,p});}
function confetti(){const p=[];for(let i=0;i<120;i++)p.push({x:Math.random()*LW,y:-Math.random()*100,vx:(Math.random()-.5)*10,vy:20+Math.random()*25,c:['#ff80b0','#fff','#ffe040','#80d0ff'][i%4]});fx.push({k:'cf',t:8,p});}

  <div class="shopList"><button class="btn" data-atm="-10000">💵 1만원 출금</button><button class="btn" data-atm="-50000">💵 5만원 출금</button><button class="btn" data-atm="10000">🏦 1만원 입금</button><button class="btn" data-atm="all">🏦 전부 입금</button></div><button class="btn" data-close>카드 꺼내기</button>`);}

    if(ans){near.tx=near.x;near.ty=near.y;near.dir=me.x>near.x?1:-1;say(near,ans.replace('{n}',near.name));}},800+Math.random()*900);});
$('sndBtn').onclick=e=>{sndOn=!sndOn;e.target.textContent=sndOn?'🔊':'🔇';};

const logEl=$('log');

function addLog(h){const d=document.createElement('div');d.innerHTML=h;logEl.appendChild(d);while(logEl.children.length>100)logEl.firstChild.remove();logEl.scrollTop=logEl.scrollHeight;}

function updMoney(){$('wallet').textContent=st.wallet.toLocaleString()+'원';$('bank').textContent=st.bank.toLocaleString()+'원';$('spouseRow').style.display=st.spouse?'flex':'none';$('spouse').textContent=st.spouse||'';}
function updMap(){$('regionName').textContent=R[cur].name;$('map').innerHTML=MAP.flat().map(id=>`<div class="${id===cur||(cur==='myroom'&&id==='house')?'cur':''}">${R[id].name}</div>`).join('');}
function updWho(){const list=[me,...[...remotes.values()].filter(r=>r.region===cur)].filter(Boolean);
  $('who').innerHTML=list.map(a=>`<div>${a===me?'😊':'🧑'} ${esc(a.name)}${a===me?' (나)':''}</div>`).join('')+npcObjs[cur].map(n=>`<div style="color:#666">🏠 ${esc(n.name)} (주민)</div>`).join('');}
function updInv(){const ks=Object.keys(st.inv);$('inv').innerHTML=ks.length?ks.map(k=>`<div class="it${me&&me.held===k?' held':''}${me&&ITEMS[k].w&&me.wear[ITEMS[k].w]?' held':''}" data-it="${k}" title="${ITEMS[k].n}">${ITEMS[k].e}<small>${st.inv[k]}</small></div>`).join(''):'<div style="grid-column:1/6;font-size:11px;color:#666">비어 있음. 상점에서 물건을 사보세요!</div>';}
$('inv').addEventListener('click',e=>{const el=e.target.closest('[data-it]');if(!el||!me)return;const k=el.dataset.it,it=ITEMS[k];
  if(it.f){delItem(k);say(me,`냠냠 ${it.n} 맛있다!`);tone(400,.05);tone(500,.05,'square',.05,.1);return;}
  if(it.w){me.wear[it.w]=!me.wear[it.w];sys(me.wear[it.w]?`${it.n}을(를) 착용했습니다.`:`${it.n}을(를) 벗었습니다.`);updInv();save();return;}
  me.held=me.held===k?null:k;sys(me.held?`${it.n}을(를) 들었습니다. 주민을 클릭하면 선물할 수 있어요!`:`${it.n}을(를) 내려놓았습니다.`);updInv();});
// 모달
function openModal(t,h){$('mTitle').textContent=t;$('mBody').innerHTML=h;$('modal').style.display='flex';}
function closeModal(){$('modal').style.display='none';}
$('modal').addEventListener('click',e=>{const b=e.target.closest('button');if(e.target.id==='modal'){closeModal();return;}if(!b)return;
  if(b.dataset.close!==undefined)closeModal();
  if(b.dataset.buy){const i=b.dataset.buy;if(pay(ITEMS[i].p,ITEMS[i].n)){addItem(i);sys(`${ITEMS[i].e} ${ITEMS[i].n}을(를) 샀습니다.`);const k=SHOPS.super.includes(i)?'super':'dept';openShop(k);}}
  if(b.dataset.atm)atm(b.dataset.atm);
  if(b.dataset.job){const ok=b.dataset.job===job.want;if(ok){job.ok++;SFX.coin();}else SFX.error();job.round++;jobRound();}
  if(b.dataset.sub){if(pay(300,'지하철')){closeModal();sys('🚇 덜컹덜컹... 지하철을 탔습니다.');tone(300,.4,'sawtooth',.03);setTimeout(()=>go(b.dataset.sub,'d'),600);}}
  if(b.dataset.wed)doWedding(b.dataset.wed);
});

// ============ 탭 간 멀티 ============
const bc=('BroadcastChannel' in window)?new BroadcastChannel('mong97'):null;
function send(m){if(bc&&me)bc.postMessage({...m,id:myId,name:me.name});}
if(bc)bc.onmessage=({data:m})=>{if(!me||m.id===myId)return;let r=remotes.get(m.id);
  if(!r){if(m.t!=='pos')return;r=mkAv({id:m.id,name:m.name,face:m.face,x:m.x,y:m.y,nx:m.x,ny:m.y,region:m.region});remotes.set(m.id,r);sys(`${m.name}님이 접속했습니다.`);SFX.door();}
  r.seen=performance.now();
  if(m.t==='pos'){if(r.region!==m.region){r.x=m.x;r.y=m.y;}r.region=m.region;r.nx=m.x;r.ny=m.y;r.sitting=m.sit;r.held=m.held;r.wear=m.wear||{};r.face=m.face;updWho();}
  if(m.t==='chat'&&r.region===cur)say(r,m.msg,false);
  if(m.t==='emote'&&r.region===cur)emote(r,m.e,false);
  if(m.t==='bye'){remotes.delete(m.id);sys(`${m.name}님이 나갔습니다.`);updWho();}};
addEventListener('beforeunload',()=>send({t:'bye'}));

// ============ 로그인 / 얼굴 만들기 ============
const face={hair:0,hc:0,eye:0,mouth:0,skin:0,body:0};
const LIM={hair:HAIRN,hc:HAIRC.length,eye:EYEN,mouth:MOUTHN,skin:SKIN.length,body:BODY.length};
const fc=$('face'),fg=fc.getContext('2d');
function drawFace(){fg.fillStyle='#9cf';fg.fillRect(0,0,40,50);fg.fillStyle='#4a4';fg.fillRect(0,42,40,8);drawAv(fg,mkAv({face}),20,44,0);
  $('combo').textContent=`얼굴 ${(HAIRN*HAIRC.length*EYEN*MOUTHN*SKIN.length).toLocaleString()}가지 조합`;}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f;face[k]=(face[k]+ +b.dataset.d+LIM[k])%LIM[k];drawFace();tone(1200,.03);});
$('rnd').onclick=()=>{for(const k in LIM)face[k]=Math.random()*LIM[k]|0;drawFace();};
const sv=load();
if(sv){Object.assign(face,sv.face);$('nameIn').value=sv.name||'';Object.assign(st,sv.st);}else $('rnd').onclick();
drawFace();
function enter(){
  const name=$('nameIn').value.trim()||('손님'+(Math.random()*900+100|0));
  me=mkAv({name,face:{...face},x:160,y:178,tx:160,ty:178,wear:(sv&&sv.wear)||{}});
  $('login').style.display='none';$('myName').textContent='😊 '+name;
  fit();updMoney();updMap();updWho();updInv();save();
  sys('삐-삐-삐-치지직... 모뎀 연결 성공! (28.8Kbps)');
  sys(`${name}님, 몽도시 '97에 오신 것을 환영합니다!`);
  sys('바닥 클릭=이동 · 사람 클릭=말걸기/선물 · 건물/물건 클릭=이용 · 파란 화살표=다른 지역');
  sys('같은 브라우저에 새 탭을 열면 다른 아바타로 함께 채팅할 수 있어요.');
  SFX.door();setTimeout(()=>say(npcObjs.plaza[0],`${name}님 방가방가~ ^^`),1200);
  send({t:'pos',region:cur,x:me.x,y:me.y,face:me.face});
}
$('enter').onclick=enter;$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')enter();});

// 시계
setInterval(()=>{const d=new Date();$('clock').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;},1000);

initNpcs();fit();
let last=performance.now();
function loop(now){DT=Math.min(.05,(now-last)/1000);last=now;T+=DT;update(DT);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
